# Database configuration for Temporal using PostgreSQL as the persistence and visibility store.
# For AWS EKS production: Configure IRSA role with S3 permissions, remove endpoint/credentials
# For LocalStack development: Keep endpoint in s3store, use test credentials

# serviceAccount:
#   create: true
#   name: temporal-sa
  # For EKS with IRSA, add annotation pointing to the IAM role ARN:
  # extraAnnotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/temporal-irsa-s3-role"

server:
  image:
    repository: temporalio/server
    tag: 1.31.0
  # Replicas and resources for the Temporal server
  replicaCount: 1

  # internal-frontend:
  #   # Enable this to create internal-frontend
  #   enabled: true
  #   service:
  #     # Evaluated as template
  #     type: ClusterIP
  #     port: 7236
  #     appProtocol: tcp
  #     membershipPort: 6936
  #     membershipAppProtocol: tcp
  #     httpPort: 7246
  #     httpAppProtocol: http

  archival:
    history:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: "us-east-1"
          endpoint: "http://localstack.localstack.svc.cluster.local:4566"
          s3ForcePathStyle: true
    visibility:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: "us-east-1"
          endpoint: "http://localstack.localstack.svc.cluster.local:4566"
          s3ForcePathStyle: true

  namespaceDefaults:
    archival:
      history:
        state: "enabled"
        URI: "s3://aws-archival"
      visibility:
        state: "enabled"
        URI: "s3://aws-archival-visibility"

  config:
    metrics:
      prometheus:
        timerType: histogram
        listenAddress: "0.0.0.0:9090"
    namespaces:
      create: true
      namespace:
        - name: approval-namespace
          retention: 30d
        # - name: approval-namespace2
        #   retention: 1h
        # - name: default
        #   retention: 1h
    authorization:
      jwtKeyProvider:
        keySourceURIs:
          - "https://login.microsoftonline.com/4e504525-4091-495a-8de0-3ee18187abac/discovery/v2.0/keys"
        refreshInterval: "30m"
      permissionsClaimName: "roles"
      authorizer: "default"
      claimMapper: "default"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            databaseName: tmprldcd
            connectAddr: "192.168.49.1:54320"
            connectProtocol: "tcp"
            user: "cnxtmpld"
            connectAttributes:
              search_path: "tmpld"
            existingSecret: aws-secret-rds-temporal
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            databaseName: tmplvdcd
            connectAddr: "192.168.49.1:54320"
            connectProtocol: "tcp"
            user: "cnxtmpld"
            connectAttributes:
              search_path: "tmplv"
            existingSecret: aws-secret-rds-temporal
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"
  additionalEnvSecretName: "aws-secret-rds-temporal"
  additionalEnv:
    - name: AWS_ACCESS_KEY_ID
      value: "test"
    - name: AWS_SECRET_ACCESS_KEY
      value: "test"
    - name: AWS_REGION
      value: "us-east-1"
    - name: SQL_HOST
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: host
    - name: SQL_PORT
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: port
    - name: SQL_USER
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: username
    - name: SQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: dbname
    - name: TEMPORAL_GRPC_META_AUTHORIZATION
      value: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6IndoMDZzRWt6TEhKNXNOTmFVeVJZMl82TzhLMCJ9..a7UX8LBS3C6urCEDfrkGHBHmEpoHMOxyeF_u4WUqg5XBaPlTcwDnD9nBdL4OEo7L70THrxmJdz9ZPgVWwYaKpLkkaMPeVcDRqwh0RUnEQ_Bl9hHxrbBjyGUKVfpzI6QlL8GvOUEzWuOzqBBhceInRkB-LPaL2s70o_ekNOONfms_Wd_ds5zn2quL_ZSFfcopa5kX5P7W-SFiGIMFKIphhuyvwg7qn2lpI2pByorDEjUC8U8FrrZs2sx8wpQlIT3zMu8nRiuphP4p4AqsOf1nw-GPOpbQWOgGWryu7jNFhYAJ4N03-MspitSbFBWMwnxykB04yrDAE2OljQTezRVSYg"
    # - name: INTERNAL_FRONTEND_GRPC_PORT
    #   value: "7236"
    # - name: INTERNAL_FRONTEND_MEMBERSHIP_PORT
    #   value: "6936"
  frontend:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

  history:
    # Replicas and resources for the history service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 1G
    
  matching:
    # Replicas and resources for the matching service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi    

  worker:
    # Replicas and resources for the worker service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
    additionalEnv:
    - name: TEMPORAL_GRPC_META_AUTHORIZATION
      value: "Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsImtpZCI6IndoMDZzRWt6TEhKNXNOTmFVeVJZMl82TzhLMCJ9..a7UX8LBS3C6urCEDfrkGHBHmEpoHMOxyeF_u4WUqg5XBaPlTcwDnD9nBdL4OEo7L70THrxmJdz9ZPgVWwYaKpLkkaMPeVcDRqwh0RUnEQ_Bl9hHxrbBjyGUKVfpzI6QlL8GvOUEzWuOzqBBhceInRkB-LPaL2s70o_ekNOONfms_Wd_ds5zn2quL_ZSFfcopa5kX5P7W-SFiGIMFKIphhuyvwg7qn2lpI2pByorDEjUC8U8FrrZs2sx8wpQlIT3zMu8nRiuphP4p4AqsOf1nw-GPOpbQWOgGWryu7jNFhYAJ4N03-MspitSbFBWMwnxykB04yrDAE2OljQTezRVSYg"

