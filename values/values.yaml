# Database configuration for Temporal using PostgreSQL as the persistence and visibility store.
# For AWS EKS production: Configure IRSA role with S3 permissions, remove endpoint/credentials
# For LocalStack development: Keep endpoint in s3store, use test credentials

# serviceAccount:
#   create: true
#   name: temporal-sa
  # For EKS with IRSA, add annotation pointing to the IAM role ARN:
  # extraAnnotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/temporal-irsa-s3-role"

server:
  image:
    repository: temporalio/server
    tag: 1.31.0
  # Replicas and resources for the Temporal server
  replicaCount: 1

  internal-frontend:
    # Enable this to create internal-frontend
    enabled: true
    service:
      # Evaluated as template
      type: ClusterIP
      port: 7236
      appProtocol: tcp
      membershipPort: 6936
      membershipAppProtocol: tcp
      httpPort: 7246
      httpAppProtocol: http

  archival:
    history:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: "us-east-1"
          endpoint: "http://localstack.localstack.svc.cluster.local:4566"
          s3ForcePathStyle: true
    visibility:
      state: "enabled"
      enableRead: true
      provider:
        s3store:
          region: "us-east-1"
          endpoint: "http://localstack.localstack.svc.cluster.local:4566"
          s3ForcePathStyle: true

  namespaceDefaults:
    archival:
      history:
        state: "enabled"
        URI: "s3://aws-archival"
      visibility:
        state: "enabled"
        URI: "s3://aws-archival-visibility"

  config:
    metrics:
      prometheus:
        timerType: histogram
        listenAddress: "0.0.0.0:9090"
    namespaces:
      create: true
      namespace:
        - name: approval-namespace
          retention: 30d
        - name: approval-namespace2
          retention: 1h
        - name: default
          retention: 1h
    authorization:
      jwtKeyProvider:
        keySourceURIs:
          - "https://login.microsoftonline.com/4e504525-4091-495a-8de0-3ee18187abac/discovery/v2.0/keys"
        refreshInterval: "30m"
      permissionsClaimName: "roles"
      authorizer: "default"
      claimMapper: "default"
    persistence:
      defaultStore: default
      visibilityStore: visibility
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            databaseName: tmprldcd
            connectAddr: "192.168.49.1:54320"
            connectProtocol: "tcp"
            user: "cnxtmpld"
            connectAttributes:
              search_path: "tmpld"
            existingSecret: aws-secret-rds-temporal
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12_pgx
            databaseName: tmplvdcd
            connectAddr: "192.168.49.1:54320"
            connectProtocol: "tcp"
            user: "cnxtmpld"
            connectAttributes:
              search_path: "tmplv"
            existingSecret: aws-secret-rds-temporal
            secretKey: password
            maxConns: 5
            maxIdleConns: 2
            maxConnLifetime: "1h"
  additionalEnvSecretName: "aws-secret-rds-temporal"
  additionalEnv:
    - name: AWS_ACCESS_KEY_ID
      value: "test"
    - name: AWS_SECRET_ACCESS_KEY
      value: "test"
    - name: AWS_REGION
      value: "us-east-1"
    - name: SQL_HOST
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: host
    - name: SQL_PORT
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: port
    - name: SQL_USER
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: username
    - name: SQL_DATABASE
      valueFrom:
        secretKeyRef:
          name: aws-secret-rds-temporal
          key: dbname
  frontend:
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

  history:
    # Replicas and resources for the history service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 1G
    
  matching:
    # Replicas and resources for the matching service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi    

  worker:
    # Replicas and resources for the worker service
    replicaCount: 1
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi

## Version temporal
admintools:
  image:
    repository: temporalio/admin-tools
    tag: 1.31.0

shims:
  dockerize: false
  elasticsearchTool: false

web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: 2.49.1
  replicaCount: 1
  additionalEnv:
    - name: TEMPORAL_NOTIFY_ON_NEW_VERSION
      value: "true"
    - name: TEMPORAL_AUTH_ENABLED
      value: "true"
    - name: TEMPORAL_AUTH_ISSUER_URL
      value: "https://login.microsoftonline.com/4e504525-4091-495a-8de0-3ee18187abac/v2.0"
    - name: TEMPORAL_AUTH_PROVIDER_URL
      value: "https://login.microsoftonline.com/4e504525-4091-495a-8de0-3ee18187abac/v2.0"
    - name: TEMPORAL_AUTH_CLIENT_ID
      value: "79a79300-4903-44a0-9155-da5dab4d1f85"
    - name: TEMPORAL_AUTH_CLIENT_SECRET
      value: "M2M8Q~iTMgCTBBT9DV02KnY~ZUIiGQ1yi1TzCaeN"
    - name: TEMPORAL_AUTH_CALLBACK_URL
      value: "http://localhost:8080/auth/sso/callback"
    - name: TEMPORAL_AUTH_SCOPES
      value: "openid,profile,email,offline_access,api://79a79300-4903-44a0-9155-da5dab4d1f85/default"
    - name: TEMPORAL_AUTH_TYPE
      value: "oidc"

# Configuración para darle control a ArgoCD sobre el schema de la base de datos, para que lo ejecute antes del deploy del server
schema:
  useHelmHooks: true
  ttlSecondsAfterFinished: 300
  jobAnnotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
